# Fly.io — Amsterdam. Volume SQLite su /data.
# Merge con tipico `fly launch`: http_service + mounts + VM 1GB.
# Volume OBBLIGATORIO prima/insieme al deploy, altrimenti le machine
# non partono → "Proxy not finding machines".

app = "sostituzioni-docenti"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NODE_ENV = "production"
  SQLITE_PATH = "/data/sostituzioni.sqlite"
  AUTH_DEMO_MODE = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # Con SQLite+volume meglio tenere almeno 1 machine su
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Next cold start può superare 30s al primo boot
  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "120s"
    method = "GET"
    path = "/login"

[[mounts]]
  source = "sostituzioni_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
